<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Love mass💌</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            font-family: "Tajawal", "Segoe UI", Tahoma, sans-serif;
            -webkit-tap-highlight-color: transparent
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            color: #fff
        }

        body {
            background: linear-gradient(180deg, #070a24 0%, #1b1040 42%, #4a1450 74%, #8a2350 100%)
        }

        #sky {
            position: fixed;
            inset: 0;
            z-index: 0
        }

        #moon {
            position: fixed;
            top: 9%;
            right: 10%;
            width: 84px;
            height: 84px;
            border-radius: 50%;
            z-index: 0;
            background: radial-gradient(circle at 35% 32%, #fffdf0, #f6e7b4 55%, #d8c28a);
            box-shadow: 0 0 50px 14px rgba(255, 238, 190, .35);
            will-change: transform
        }

        #moon:after {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(190, 170, 120, .35);
            top: 30px;
            left: 44px;
            box-shadow: -22px 18px 0 -3px rgba(190, 170, 120, .3), 12px 26px 0 -5px rgba(190, 170, 120, .3)
        }

        #lock {
            justify-content: flex-start;
            overflow-y: auto
        }

        #lock>div {
            margin: auto 0
        }

        .poem {
            margin: 14px 0
        }

        .poem h2 {
            font-family: "Aref Ruqaa", serif;
            font-size: 22px;
            margin-bottom: 10px;
            font-weight: 700
        }

        #poemBtn {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            background: linear-gradient(135deg, #ffe6a7, #ffc2d1)
        }

        #poemTxt {
            overflow: hidden;
            max-height: 0;
            transition: max-height 1.2s ease;
            font-family: "Aref Ruqaa", serif;
            font-size: 21px;
            line-height: 2.2
        }

        #poemTxt.on {
            max-height: 55vh;
            overflow-y: auto;
            margin-top: 10px
        }

        #poemTxt span {
            display: block;
            opacity: 0;
            animation: up .9s forwards
        }

        #tint {
            position: fixed;
            inset: 0;
            z-index: 0;
            transition: background 1.2s
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            opacity: .5
        }

        .o1 {
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, #ff758f, transparent 70%);
            top: -80px;
            right: -60px
        }

        .o2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #ffb3c1, transparent 70%);
            bottom: -60px;
            left: -60px
        }

        canvas#c {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none
        }

        .screen {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px;
            overflow: hidden
        }

        .screen.on {
            display: flex
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 16px;
            padding: 11px 16px;
            font-size: 15px;
            font-weight: 700;
            background: #fff;
            color: #c9184a;
            transition: transform .15s;
            box-shadow: 0 6px 18px rgba(90, 0, 20, .25)
        }

        button:active {
            transform: scale(.93)
        }

        button.g {
            background: rgba(255, 255, 255, .2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .5);
            border: 1px solid rgba(255, 255, 255, .45);
            border-radius: 30px;
            padding: 24px;
            max-width: 430px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(90, 0, 20, .4)
        }

        /* ظرف */
        .env {
            position: relative;
            width: min(80vw, 300px);
            height: 190px;
            margin: 0 auto 14px;
            perspective: 700px;
            animation: fw 4s ease-in-out infinite
        }

        @keyframes fw {
            50% {
                transform: translateY(-8px)
            }
        }

        .env>div {
            position: absolute;
            inset: 0;
            border-radius: 10px
        }

        .bk {
            background: linear-gradient(#ffd6de, #ffb3c1);
            box-shadow: 0 20px 40px rgba(70, 0, 15, .4)
        }

        .ft {
            background: #ff9fb3;
            clip-path: polygon(0 100%, 50% 38%, 100% 100%)
        }

        .fl {
            height: 62% !important;
            bottom: auto;
            background: linear-gradient(#ffc2cf, #ff8fa8);
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            transform-origin: top;
            transition: transform .8s;
            z-index: 3;
            border-radius: 0 !important
        }

        .seal {
            inset: auto !important;
            left: 50%;
            top: 44%;
            transform: translate(-50%, -50%);
            width: 58px;
            height: 58px;
            border-radius: 50% !important;
            background: radial-gradient(circle at 35% 30%, #ff4d6d, #7a0620);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            z-index: 4;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .4);
            animation: hb 1.3s infinite
        }

        @keyframes hb {
            50% {
                transform: translate(-50%, -50%) scale(1.15)
            }
        }

        .env.open .fl {
            transform: rotateX(180deg);
            z-index: 1
        }

        .env.open .seal {
            animation: crack .7s forwards
        }

        @keyframes crack {
            to {
                transform: translate(-50%, -50%) scale(1.8) rotate(25deg);
                opacity: 0
            }
        }

        .dots4 {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin: 6px 0 12px
        }

        .dots4 i {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #fff;
            transition: .2s
        }

        .dots4 i.f {
            background: #fff;
            box-shadow: 0 0 12px #fff;
            transform: scale(1.2)
        }

        .keys {
            display: grid;
            grid-template-columns: repeat(3, 66px);
            gap: 10px;
            justify-content: center
        }

        .keys button {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            padding: 0;
            font-size: 24px;
            background: rgba(255, 255, 255, .2);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, .5);
            font-size: 14px;
            margin-bottom: 4px
        }

        /* الرسالة */
        #paper h1 {
            font-family: "Aref Ruqaa", serif;
            font-size: 32px;
            margin: 2px 0 10px
        }

        #paper .t span {
            display: block;
            font-size: 18px;
            line-height: 2;
            opacity: 0;
            animation: up .8s forwards
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(14px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        #nm {
            display: block;
            margin: 0 auto;
            max-width: 100%
        }

        .cnt {
            margin: 12px 0;
            padding: 10px;
            border-radius: 16px;
            background: rgba(255, 255, 255, .18);
            font-size: 16px
        }

        .cnt b {
            font-size: 30px;
            display: block;
            font-family: "Aref Ruqaa"
        }

        /* المعرض */
        .gal {
            justify-content: flex-start
        }

        .bar {
            display: flex;
            gap: 7px;
            justify-content: center;
            flex-wrap: nowrap;
            position: relative;
            z-index: 6;
            width: 100%;
            padding-top: max(6px, env(safe-area-inset-top));
            pointer-events: none
        }

        .bar button {
            pointer-events: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            padding: 0;
            border-radius: 50%;
            font-size: 18px;
            flex: none
        }

        .own {
            display: none !important
        }

        body.owner .own:not([hidden]) {
            display: flex !important
        }

        #sec {
            position: absolute;
            top: 0;
            left: 0;
            width: 64px;
            height: 50px;
            z-index: 5
        }

        #tip {
            font-size: 12px;
            opacity: .85;
            margin: 2px 0 8px;
            transition: opacity 1s;
            text-align: center
        }

        .mid {
            text-align: center
        }

        #ctr {
            font-size: 13px;
            opacity: .9;
            margin-bottom: 5px
        }

        .fr img {
            animation: kb 9s ease-in-out infinite alternate
        }

        @keyframes kb {
            to {
                transform: scale(1.08)
            }
        }

        .card.act .fr {
            box-shadow: 0 14px 28px rgba(70, 0, 15, .45), 0 0 0 1px rgba(255, 255, 255, .6), 0 0 44px rgba(255, 205, 220, .5)
        }

        #paper h1 {
            background: linear-gradient(90deg, #fff, #ffd3df, #fff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .stage {
            position: relative;
            width: 100%;
            max-width: 980px;
            flex: 1 1 0;
            min-height: 0;
            max-height: 640px;
            margin: 6px 0;
            perspective: 1200px;
            direction: ltr;
            touch-action: pan-y;
            user-select: none
        }

        .card {
            position: absolute;
            left: 50%;
            top: 50%;
            height: min(90%, 440px);
            max-width: 76vw;
            aspect-ratio: 3/4;
            transition: transform .7s cubic-bezier(.2, .9, .25, 1), opacity .6s;
            transform-style: preserve-3d;
            cursor: pointer;
            will-change: transform
        }

        .tilt {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d;
            transform: rotateX(var(--rx, 0deg)) rotateY(calc(var(--ry, 0deg) + var(--fl, 0deg)));
            transition: transform .55s cubic-bezier(.2, .9, .25, 1)
        }

        .card.fl .tilt {
            --fl: 180deg
        }

        .face {
            position: absolute;
            inset: 0;
            border-radius: 28px;
            overflow: hidden;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            box-shadow: 0 14px 28px rgba(70, 0, 15, .45), 0 0 0 1px rgba(255, 255, 255, .5)
        }

        .face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none
        }

        .cap {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 40px 14px 14px;
            background: linear-gradient(transparent, rgba(60, 0, 15, .8));
            text-align: center;
            font-size: 19px;
            direction: rtl
        }

        .cap:empty {
            display: none
        }

        .dt {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, .85);
            color: #c9184a;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            direction: rtl
        }

        .dt:empty {
            display: none
        }

        .glare {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--gx, 50%) var(--gy, 0%), rgba(255, 255, 255, .4), transparent 55%);
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none
        }

        .card.act .glare {
            opacity: 1
        }

        .card.act .fr {
            animation: pop .6s
        }

        @keyframes pop {
            from {
                opacity: .55
            }
        }

        .bkf {
            transform: rotateY(180deg);
            background: linear-gradient(145deg, #ff4d6d, #9d0208);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 26px;
            text-align: center;
            direction: rtl;
            font-family: "Aref Ruqaa", serif;
            font-size: 24px;
            line-height: 1.9;
            border: 2px solid rgba(255, 255, 255, .6)
        }

        .bkf:before {
            content: "💗";
            position: absolute;
            top: 14px;
            font-size: 26px
        }

        .hint {
            position: absolute;
            bottom: 6px;
            font-size: 11px;
            opacity: .7;
            font-family: Tajawal
        }

        .empty {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            font-size: 52px;
            padding: 0;
            animation: gl 2s infinite
        }

        .empty[hidden] {
            display: none
        }

        @keyframes gl {
            70% {
                box-shadow: 0 0 0 30px rgba(255, 255, 255, 0)
            }

            0% {
                box-shadow: 0 0 0 0 rgba(255, 255, 255, .7)
            }
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: max(12px, env(safe-area-inset-bottom));
            position: relative;
            z-index: 6
        }

        .nav button {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            padding: 0;
            font-size: 22px
        }

        .dots {
            display: flex;
            gap: 7px;
            max-width: 170px;
            flex-wrap: wrap;
            justify-content: center;
            direction: ltr
        }

        .dots i {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .45);
            cursor: pointer;
            transition: .3s
        }

        .dots i.a {
            background: #fff;
            transform: scale(1.5);
            box-shadow: 0 0 10px #fff
        }

        .modal {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: rgba(40, 0, 10, .6);
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            overflow-y: auto
        }

        .modal.on {
            display: flex
        }

        .box {
            background: linear-gradient(145deg, #ff4d6d, #c9184a);
            border: 1px solid rgba(255, 255, 255, .4);
            border-radius: 26px;
            padding: 20px;
            max-width: 420px;
            width: 100%;
            margin: auto
        }

        .box h3 {
            margin: 0 0 8px;
            font-size: 17px
        }

        .box input,
        .box textarea {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            margin-bottom: 8px;
            background: #fff;
            color: #8a0a25;
            outline: none;
            text-align: right
        }

        .box textarea {
            min-height: 70px;
            resize: vertical
        }

        .row {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
            margin-bottom: 6px
        }

        hr {
            border: none;
            border-top: 1px solid rgba(255, 255, 255, .3);
            margin: 14px 0
        }

        #fin {
            z-index: 15;
            background: rgba(60, 0, 15, .25)
        }

        #fin h2 {
            font-family: "Aref Ruqaa", serif;
            font-size: 40px;
            margin-bottom: 14px
        }

        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #c9184a;
            padding: 10px 18px;
            border-radius: 30px;
            z-index: 30;
            display: none;
            font-weight: 700;
            max-width: 90%;
            text-align: center
        }
    </style>
</head>

<body>
    <canvas id="sky"></canvas>
    <div id="moon"></div>
    <div id="tint"></div>
    <canvas id="c"></canvas>

    <div class="screen on" id="lock">
        <div id="lk" style="text-align:center">
            <div class="env" id="env">
                <div class="bk"></div>
                <div class="ft"></div>
                <div class="fl"></div>
                <div class="seal">💗</div>
            </div>
            <div class="dots4" id="d4"><i></i><i></i><i></i><i></i></div>
            <div class="err" id="err">اكتب كلمة السر لتفتح الظرف</div>
            <div class="keys" id="keys"></div>
        </div>
        <div class="glass" id="paper" style="display:none">
            <canvas id="nm"></canvas>
            <h1 id="lTitle"></h1>
            <div class="t" id="lText"></div>
            <div class="poem" id="poemBox">
                <h2 id="poemH"></h2><button id="poemBtn">اضغط للفتح 💌</button>
                <div id="poemTxt"></div>
            </div>
            <div class="cnt" id="cnt" style="display:none">مرّ علينا<b id="days">0</b>يوم من الحب 💞</div>
            <button id="go" style="width:100%;padding:14px;font-size:17px">افتح الصور 💖</button>
        </div>
    </div>

    <div class="screen gal" id="gal">
        <div class="bar">
            <button id="add" class="own" title="إضافة صورة">➕</button><button id="edit" class="g own"
                title="تعديل">✏️</button>
            <button id="share" class="g own" title="نسخ رابط جديد">🔗</button><button id="save" class="g own"
                title="تنزيل نسخة">💾</button>
            <button id="play" class="g" title="عرض تلقائي">▶</button><button id="mus" class="g"
                title="الموسيقى">🎵</button><button id="rst" class="g" title="إعادة من البداية">🔄</button>
        </div>
        <div class="stage" id="stage"><button class="empty own" id="empty" hidden>➕</button></div>
        <div id="tip">اسحب للتقليب • اضغط على الصورة لتنقلب 💗</div>
        <div class="nav"><button id="next">❯</button>
            <div class="mid">
                <div id="ctr"></div>
                <div class="dots" id="dots"></div>
            </div><button id="prev">❮</button>
        </div>
        <input type="file" id="file" accept="image/*" multiple hidden>
    </div>

    <div class="screen" id="fin">
        <div class="glass">
            <h2 id="endT"></h2><button id="finX">رجوع للصور</button>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="box">
            <h3>✏️ البطاقة الحالية</h3>
            <input id="capIn" placeholder="كلمة تحت الصورة"><input id="dateIn"
                placeholder="تاريخ أو عنوان (مثال: أول لقاء)">
            <textarea id="backIn" placeholder="رسالة على ظهر البطاقة (اضغط البطاقة لتنقلب)"></textarea>
            <div class="row"><button id="saveCap">حفظ</button><button id="chg" class="g">تغيير الصورة</button><button
                    id="del" class="g">🗑 حذف</button><button id="mvL" class="g">⬅</button><button id="mvR"
                    class="g">➡</button></div>
            <hr>
            <h3>💌 الرسالة والمفاجأة</h3>
            <input id="titleIn" placeholder="العنوان"><textarea id="textIn"></textarea>
            <input id="nameIn" placeholder="اسمها (القلوب تتشكّل على شكله) 💖"><input id="sinceIn" type="date"><input
                id="poemTIn" placeholder="عنوان الشعر (مثال: كتبتُ لكِ أبياتاً خصيصاً لكِ)"><textarea id="poemIn"
                placeholder="اكتب هنا الأبيات، كل بيت في سطر" style="min-height:140px"></textarea><input id="endIn"
                placeholder="جملة الختام">
            <div class="row"><button id="saveL">حفظ</button><button id="close" class="g">إغلاق</button></div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

    <script id="baked">window.BAKED = null;</script>
    <script>
        const SRC = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
        const PASS = "0000", EDIT = "1111", $ = id => document.getElementById(id);
        const DEFPOEM = "يا قمراً في ليلي أضاء\nوعمراً بحضوركِ يزداد بهاء\nكلُّ الكلام يضيقُ عن وصفكِ\nوقلبي لكِ وحدكِ هوىً ووفاء";
        let data = { title: "إلى من أحب", text: "في كل يوم أكتشف سبباً جديداً لأحبك أكثر.\nهذه الرسالة صغيرة، لكن قلبي فيها كبير.", name: "", since: "", poemT: "", poem: "", end: "وهذا مجرد البداية 💍", cards: [], ts: 0 };
        let idx = 0, rep = false, show = null;

        /* حفظ */
        const b64u = b => { let s = ""; b.forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "") };
        const unb = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
        async function enc(o) {
            const r = new TextEncoder().encode(JSON.stringify(o));
            if (window.CompressionStream) return "z" + b64u(new Uint8Array(await new Response(new Blob([r]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer()));
            return "p" + b64u(r)
        }
        async function dec(s) {
            const b = unb(s.slice(1));
            if (s[0] == "z") return JSON.parse(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
            return JSON.parse(new TextDecoder().decode(b))
        }
        function saveL() { data.ts = Date.now(); if (location.hash) history.replaceState(null, "", location.pathname + location.search); try { localStorage.setItem("loveData3", JSON.stringify(data)) } catch (e) { toast("الذاكرة ممتلئة، استخدم 💾") } }
        async function load() {
            try { const m = location.hash.match(/^#d=(.+)$/); if (m) { data = await dec(m[1]); return } } catch (e) { }
            let l = null; try { l = JSON.parse(localStorage.getItem("loveData3")) } catch (e) { }

        let lt = 0; addEventListener("pointermove", e => {
            ms.x = e.clientX; ms.y = e.clientY; tx = (e.clientX / W - .5) * 2; ty = (e.clientY / H - .5) * 2; const t = performance.now();
            if (t - lt > 70 && hs.length < 60) { lt = t; const h = mk(e.clientX, e.clientY, true); h.e = "✨"; h.s = 14; h.life = 28; h.vx = (Math.random() - .5) * 1.5; h.vy = (Math.random() - .5) * 1.5; hs.push(h) }
        });
        addEventListener("pointerdown", e => { if (!e.target.closest("button,input,textarea,.modal,.stage")) burst(e.clientX, e.clientY, 10) });
        (function tick() {
            if (document.hidden) return requestAnimationFrame(tick);
            cx.clearRect(0, 0, W, H);
            if (hs.length < 42 && Math.random() < .08) hs.push(mk(undefined, undefined, false, Math.random() < .3));
            hs = hs.filter(h => h.life > 0 && h.y > -60 && h.y < H + 60);
            for (const h of hs) {
                if (h.fly) { h.x += (h.tx - h.x) * .06; h.y += (h.ty - h.y) * .06; cx.globalAlpha = h.o; const z = spr(h.e, h.s); cx.drawImage(z.c, h.x - z.w / 2, h.y - z.w / 2); continue }
                h.ph += .03; h.x += h.vx + Math.sin(h.ph) * .6; h.y += h.vy; h.life--;
                const dx = h.x - ms.x, dy = h.y - ms.y, d = Math.hypot(dx, dy); if (d < 120 && d > 0) { h.x += dx / d * (120 - d) * .08; h.y += dy / d * (120 - d) * .08 }
                if (h.life < 1e8) { h.vx *= .96; h.vy = h.vy * .96 - .02 }
                cx.globalAlpha = h.life < 30 ? h.o * h.life / 30 : h.o; const q = spr(h.e, h.s); cx.drawImage(q.c, h.x - q.w / 2, h.y - q.w / 2);
            }
            requestAnimationFrame(tick);
        })();
        document.body.classList.add("owner");
        load().then(() => { });
    </script>
